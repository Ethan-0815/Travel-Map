<!doctype html><html><meta charset=utf-8><title>Responsive layout QA</title><style>body{font:14px sans-serif;margin:12px;background:#e8e8e8}iframe{border:0;background:white;display:block}section{display:inline-block;vertical-align:top;margin:8px}pre{white-space:pre-wrap}button{padding:8px;margin:4px}</style><button data-view=stats>统计</button><button data-view=journeys>时间线</button><button data-view=map>地图</button><button id=theme>切换深浅色</button><div id=frames></div><pre id=report>Loading</pre><script>
let view='stats',theme='light';const results={};function draw(){document.querySelector('#frames').replaceChildren();for(const width of [390,780,1024]){const section=document.createElement('section');section.textContent=width+'px';const f=document.createElement('iframe');f.width=width;f.height=844;f.src='qa-ui.html?view='+view+'&theme='+theme+(width===390?'&functional=1':'');section.append(f);document.querySelector('#frames').append(section);}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;draw()});document.querySelector('#theme').onclick=()=>{theme=theme==='light'?'dark':'light';draw()};addEventListener('message',e=>{if(e.origin===location.origin&&e.data.qaUI){const r=e.data.qaUI;results[r.width+'-'+r.theme+'-'+r.view]=r;document.querySelector('#report').textContent=JSON.stringify(results,null,2)}});draw();
</script></html>
